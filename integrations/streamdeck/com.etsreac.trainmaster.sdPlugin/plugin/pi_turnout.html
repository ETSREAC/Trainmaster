<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Weiche stellen</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; color: #d8d8d8; background: #2d2d2d; padding: 12px; margin: 0; }
    .sdpi-item { margin-bottom: 12px; }
    .sdpi-heading { font-weight: bold; margin-bottom: 4px; color: #8b949e; text-transform: uppercase; font-size: 9px; }
    select, input { width: 100%; background: #1e1e1e; border: 1px solid #444; color: #fff; padding: 6px; border-radius: 4px; box-sizing: border-box; }
    .status-hint { margin-top: 6px; font-size: 10px; color: #888; }
  </style>
</head>
<body>
  <div class="sdpi-item">
    <div class="sdpi-heading">Weiche auswählen</div>
    <select id="turnout-select">
      <option value="">(Wähle eine Weiche)</option>
    </select>
    <div id="status-hint" class="status-hint">Lade Weichen...</div>
  </div>

  <script>
    let websocket = null;
    let uuid = null;
    let actionInfo = {};
    let turnoutsList = [];

    function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
      uuid = inUUID;
      actionInfo = JSON.parse(inActionInfo);
      websocket = new WebSocket("ws://127.0.0.1:" + inPort);

      websocket.onopen = function() {
        websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
        initUI();
      };
    }

    function initUI() {
      const sel = document.getElementById("turnout-select");
      sel.addEventListener("change", () => {
        saveSettings({ turnoutId: sel.value });
      });

      // 1. Sofortiger REST-Fetch für maximale Zuverlässigkeit
      fetch("http://localhost:3001/api/turnouts")
        .then(r => r.json())
        .then(data => {
          if (Array.isArray(data) && data.length > 0) {
            renderTurnouts(data);
          }
        })
        .catch(() => {});

      // 2. WebSocket für Echtzeit-Sync & Fallback
      connectTrainMasterWS();
    }

    function renderTurnouts(turnouts) {
      turnoutsList = turnouts;
      const sel = document.getElementById("turnout-select");
      const hint = document.getElementById("status-hint");
      const currentVal = sel.value || actionInfo.payload?.settings?.turnoutId || "";

      sel.innerHTML = '<option value="">(Wähle eine Weiche)</option>';
      if (!turnouts || turnouts.length === 0) {
        hint.textContent = "Keine Weichen in TrainMaster angelegt.";
        return;
      }

      turnouts.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t.id;
        const addr = t.address !== undefined ? t.address : (t.dccAddress !== undefined ? t.dccAddress : "-");
        opt.textContent = `${t.name || t.id} (DCC #${addr})`;
        sel.appendChild(opt);
      });

      if (currentVal) {
        sel.value = currentVal;
      }
      hint.textContent = `${turnouts.length} Weiche(n) gefunden.`;
    }

    function connectTrainMasterWS() {
      try {
        const ws = new WebSocket("ws://localhost:3001");
        ws.onmessage = function(evt) {
          try {
            const msg = JSON.parse(evt.data);
            if ((msg.type === "INITIAL_STATE" || msg.type === "SYNC_STATE") && msg.payload?.turnouts) {
              renderTurnouts(msg.payload.turnouts);
            } else if (msg.type === "TURNOUT_UPDATED" && msg.payload) {
              const idx = turnoutsList.findIndex(t => t.id === msg.payload.id);
              if (idx >= 0) turnoutsList[idx] = msg.payload;
              else turnoutsList.push(msg.payload);
              renderTurnouts(turnoutsList);
            }
          } catch(_) {}
        };
      } catch(_) {}
    }

    function saveSettings(settings) {
      if (websocket && websocket.readyState === WebSocket.OPEN) {
        websocket.send(JSON.stringify({
          event: "setSettings",
          context: uuid,
          payload: settings
        }));
      }
    }
  </script>
</body>
</html>
